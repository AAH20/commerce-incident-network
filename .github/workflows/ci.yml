name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: |
          commerce-incidents run fixtures/demo/day1 outputs/day1 --as-of 2026-09-24T12:00:00Z
          commerce-incidents run fixtures/demo/day2 outputs/day2 --as-of 2026-09-25T12:00:00Z --previous outputs/day1/report.json
          commerce-incidents verify fixtures/demo/day2 outputs/day2/report.json --previous outputs/day1/report.json
          commerce-command outputs/desk.sqlite sync fixtures/demo/day1 --as-of 2026-09-24T12:00:00Z --actor ci-operator
          commerce-command outputs/desk.sqlite sync fixtures/demo/day2 --as-of 2026-09-25T12:00:00Z --actor ci-operator
          commerce-command outputs/desk.sqlite dashboard outputs/command.html
