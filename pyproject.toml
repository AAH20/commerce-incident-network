[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-incident-network"
version = "0.1.0"
description = "Local-first commerce channel incident detection and resolution verification"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
commerce-incidents = "commerce_incident_network.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
